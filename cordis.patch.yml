# ============================================================================
# dsh-conn-check —— DSH bundle patch
# ============================================================================
# 挂载声明：DSH 启动时按 bundle 层栈叠加，把本插件插进 profile 的配置树。
#
# 安装（推荐在界面里操作）：
#   设置 → 插件 → 添加插件 → 选中本目录（含 package.json 的那一层）
#
# 命令行等价写法（<本目录> 换成实际绝对路径）：
#   dsh plugin --profile <profile> add link:<本目录>
#
# 卸载：
#   dsh plugin --profile <profile> remove dsh-conn-check
#
# 详细步骤见同目录 INSTALL.md。
# ============================================================================

